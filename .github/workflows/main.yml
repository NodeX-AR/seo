name: Visit URL with Random Device

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Puppeteer
        run: npm install puppeteer
      - name: Run script
        run: |
          cat > script.js << 'EOF'
          const puppeteer = require('puppeteer');
          const TARGET = 'https://pressrelease.in/newsroom/17-year-old-kerala-student-recognized-by-nasa-and-python-community-for-security--c08637ec';
          const VISITS = 30;
          const INTERVAL = 10;

          function randomUA() {
            const os = ['Windows NT 10.0; Win64; x64', 'Macintosh; Intel Mac OS X 10_15_7', 'X11; Linux x86_64', 'iPhone; CPU iPhone OS 17_1 like Mac OS X', 'Android 13; Mobile'];
            const browsers = ['Chrome', 'Firefox', 'Edge'];
            const osChoice = os[Math.floor(Math.random() * os.length)];
            const browser = browsers[Math.floor(Math.random() * browsers.length)];
            const ver = 115 + Math.floor(Math.random() * 10);
            if (browser === 'Chrome') return `Mozilla/5.0 (${osChoice}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${ver}.0.0.0 Safari/537.36`;
            if (browser === 'Firefox') return `Mozilla/5.0 (${osChoice}; rv:${ver}.0) Gecko/20100101 Firefox/${ver}.0`;
            return `Mozilla/5.0 (${osChoice}) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${ver}.0.0.0 Safari/537.36 Edg/${ver}.0.0.0`;
          }

          const delay = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            for (let i = 1; i <= VISITS; i++) {
              console.log(`\nVisit ${i}/${VISITS}`);
              const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
              const page = await browser.newPage();
              await page.setUserAgent(randomUA());
              await page.setViewport({ width: 1024 + Math.floor(Math.random()*500), height: 768 + Math.floor(Math.random()*300) });
              console.log(`UA: ${(await page.evaluate(() => navigator.userAgent)).split('/')[0]}`);
              await page.goto(TARGET, { waitUntil: 'load', timeout: 20000 });
              await delay(2000 + Math.random() * 3000);
              await browser.close();
              if (i < VISITS) {
                const wait = INTERVAL * 1000 + Math.random() * 1000;
                console.log(`Waiting ${Math.round(wait/1000)}s...`);
                await delay(wait);
              }
            }
            console.log('Done.');
          })();
          EOF
          node script.js
